<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>狐の悪魔 — Kitsuna no Akuma</title>
    <meta name="description" content="An open-world action RPG. You signed a contract with the Fox Devil. Now become the strongest." />
    <meta name="theme-color" content="#0d0a0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      /* Boot screen: painted before any JS/CSS lands so first paint is never white. */
      html, body { margin: 0; height: 100%; background: #0b0708; overflow: hidden; }
      body { font-family: "Iowan Old Style", "Palatino Linotype", "Yu Mincho", "Hiragino Mincho ProN", serif; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 999;
        background: radial-gradient(120% 90% at 50% 8%, #2a1216 0%, #150c0e 45%, #0b0708 100%);
        color: #e8dcc8; transition: opacity .5s ease;
      }
      #boot .mark { text-align: center; user-select: none; }
      #boot .kanji {
        font-size: 68px; letter-spacing: .28em; margin: 0 0 6px; text-indent: .28em;
        color: #f3e7d0; text-shadow: 0 0 26px rgba(214, 74, 44, .55), 0 2px 0 #000;
      }
      #boot .sub {
        font-size: 12px; letter-spacing: .58em; text-indent: .58em; text-transform: uppercase;
        color: #b3927a; margin-bottom: 34px;
      }
      #boot .bar { width: 260px; height: 2px; background: #2c2022; overflow: hidden; margin: 0 auto; }
      #boot .bar i { display: block; height: 100%; width: 8%; background: #d64a2c; animation: bootslide 1.4s ease-in-out infinite; }
      @keyframes bootslide { 0% { margin-left: -10% } 100% { margin-left: 104% } }
      #boot .tip { margin-top: 22px; font-size: 11px; letter-spacing: .18em; color: #6f584f; }
      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- the renderer -->
    <canvas id="game"></canvas>

    <!-- ui hosts (filled by src/ui) -->
    <div id="ui-root">
      <div id="hud" class="hidden"></div>
      <div id="panels"></div>
      <div id="wheel"></div>
      <div id="pause"></div>
      <div id="settings"></div>
      <div id="title"></div>
    </div>

    <!-- loading -->
    <div id="loading">
      <div class="load-inner">
        <div class="load-kanji">狐の悪魔</div>
        <div class="load-romaji">Kitsuna no Akuma</div>
        <div class="load-bar"><i></i></div>
        <div class="load-status"><span class="l">Sealing the contract…</span><span class="r"></span></div>
        <div class="load-tip"></div>
      </div>
    </div>

    <div id="boot">
      <div class="mark">
        <p class="kanji">狐の悪魔</p>
        <p class="sub">Kitsuna no Akuma</p>
        <div class="bar"><i></i></div>
        <p class="tip">SEALING THE CONTRACT…</p>
      </div>
    </div>

    <noscript>
      <div style="color:#e8dcc8;padding:40px;font-family:serif">
        Kitsuna no Akuma needs JavaScript and WebGL 2. Enable both, then reload.
      </div>
    </noscript>

    <script>
      // drop the paint-only boot screen once the real one mounts
      addEventListener('DOMContentLoaded', () => {
        const b = document.getElementById('boot');
        if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 600); }
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
