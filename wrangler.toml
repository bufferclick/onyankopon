# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Pages configuration for Kitsuna no Akuma.
#
# Pages reads this file for project identity only — the build itself is
# configured in the dashboard (or with `wrangler pages deploy`):
#
#   framework preset:  Vite
#   build command:     npm run build
#   output directory:  dist
#   root directory:    /
#   env:               NODE_VERSION = 22
#
# NOTE: a Pages wrangler.toml must NOT contain a [build] table (that is the
# Workers-only build setting) — Cloudflare rejects the file if it does.
# ─────────────────────────────────────────────────────────────────────────────
name = "kitsuna"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# The game ships model + audio bundles that must never be re-zipped on the fly.
# Cloudflare already serves brotli/gzip; caching and headers are pinned in
# public/_headers for the hashed build output and the asset bundle.

[env.preview]
vars = { ENVIRONMENT = "preview", ASSET_BASE = "assets/" }

[env.production]
vars = { ENVIRONMENT = "production", ASSET_BASE = "assets/" }
